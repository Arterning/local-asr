[project]
name = "funasr-api"
version = "0.1.0"
description = "FunASR two-pass streaming ASR backend compatible with the browser extension"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "funasr==1.4.16",
    "huggingface-hub>=0.34,<2",
    "numpy>=1.26,<3",
    "torch>=2.2,<3",
    "uvicorn[standard]>=0.30,<1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
